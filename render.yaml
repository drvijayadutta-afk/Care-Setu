services:
  - type: web
    name: care-setu-backend
    env: node
    plan: starter
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: care-setu-db
          property: connectionString
      - key: REDIS_URL
        sync: false

databases:
  - name: care-setu-db
    engine: postgresql
    plan: starter
    region: us-east
    ipAllowList: []
